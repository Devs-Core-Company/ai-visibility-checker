name: Feature or check request
description: Suggest a new check, connection or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to find out or fix on your site?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: For a new check, say what it should flag, why it matters for Google or AI engines, and link the source (spec, vendor docs).
  - type: textarea
    id: alternatives
    attributes:
      label: How you handle it today
