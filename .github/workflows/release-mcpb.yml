name: Claude Desktop extension

# Builds ai-visibility-checker-<version>.mcpb and attaches it to each published release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the bundle
        run: npm run bundle:mcpb
      - name: Attach to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" build/*.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Keep as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: build/*.mcpb
